<h3 class="text-lg font-bold text-center text-gray-900 mb-4">Sale Item Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <!-- Colonne de gauche -->
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Item ID</label>
      <input type="text" [(ngModel)]="saleItem.itemId" (ngModelChange)="onFieldChange('itemId', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Product Code</label>
      <input type="text" [(ngModel)]="saleItem.productCode" (ngModelChange)="onFieldChange('productCode', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
      <input type="text" [value]="saleItem.amount" readonly class="w-full p-3 border border-gray-300 rounded-md bg-gray-100 text-gray-700">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
      <input type="text" [(ngModel)]="saleItem.quantity" (ngModelChange)="onFieldChange('quantity', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Tax Code</label>
      <input type="text" [(ngModel)]="saleItem.taxCode" (ngModelChange)="onFieldChange('taxCode', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Add Prod Code</label>
      <input type="text" [(ngModel)]="saleItem.addProdCode" (ngModelChange)="onFieldChange('addProdCode', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>

  <!-- Colonne de droite -->
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Reverse Sale</label>
      <input type="text" [(ngModel)]="saleItem.reverseSale" (ngModelChange)="onFieldChange('reverseSale', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Unit Price</label>
      <input type="text" [(ngModel)]="saleItem.unitPrice" (ngModelChange)="onFieldChange('unitPrice', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Unit Measure</label>
      <input type="text" [(ngModel)]="saleItem.unitMeasure" (ngModelChange)="onFieldChange('unitMeasure', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Sale Channel</label>
      <input type="text" [(ngModel)]="saleItem.saleChannel" (ngModelChange)="onFieldChange('saleChannel', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Rebate Label</label>
      <input type="text" [(ngModel)]="saleItem.rebateLabel" (ngModelChange)="onFieldChange('rebateLabel', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Add Prod Info</label>
      <input type="text" [(ngModel)]="saleItem.addProdInfo" (ngModelChange)="onFieldChange('addProdInfo', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>
</div>

<!-- Checkbox "Select Item" -->
<div class="mt-4">
  <label class="flex items-center gap-2">
    <input type="checkbox" [(ngModel)]="saleItem.isSelected" (change)="onSelectItemChange($event)" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
    <span class="text-sm font-medium text-gray-700">Select Item</span>
  </label>
</div>
