
  <h3 class="text-2xl font-bold text-center text-gray-900 mb-8">POS Data</h3>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Colonne de gauche (7 champs) -->
    <div class="space-y-6">
      <!-- POS Timestamp -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">POS Timestamp</label>
        <input type="text" [(ngModel)]="posData.posTimestamp" [disabled]="posDataDisabledFields['posTimestamp']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Language Code -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Language Code</label>
        <select [(ngModel)]="posData.languageCode" [disabled]="posDataDisabledFields['languageCode']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="FR">FR</option>
          <option value="ENG">ENG</option>
        </select>
      </div>
      <!-- Card Entry Mode -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Card Entry Mode</label>
        <select [(ngModel)]="posData.cardEntryMode" [disabled]="posDataDisabledFields['cardEntryMode']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Manual">Manual</option>
          <option value="POS">POS</option>
        </select>
      </div>
      <!-- Shift Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Shift Number</label>
        <input type="text" [(ngModel)]="posData.shiftNumber" [disabled]="posDataDisabledFields['shiftNumber']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Terminal Batch -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Terminal Batch</label>
        <input type="text" [(ngModel)]="posData.terminalBatch" [disabled]="posDataDisabledFields['terminalBatch']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Status Request -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status Request</label>
        <input type="text" [(ngModel)]="posData.statusRequest" [disabled]="posDataDisabledFields['statusRequest']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Additional Info -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Additional Info</label>
        <input type="text" [(ngModel)]="posData.additionalInfo" [disabled]="posDataDisabledFields['additionalInfo']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
    
    <!-- Colonne de droite (5 champs) -->
    <div class="space-y-6">
      <!-- Outdoor Position -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Outdoor Position</label>
        <input type="text" [(ngModel)]="posData.outdoorPosition" [disabled]="posDataDisabledFields['outdoorPosition']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Clerk ID -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Clerk ID</label>
        <input type="text" [(ngModel)]="posData.clerkId" [disabled]="posDataDisabledFields['clerkId']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Clerk Level -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Clerk Level</label>
        <input type="text" [(ngModel)]="posData.clerkLevel" [disabled]="posDataDisabledFields['clerkLevel']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Service Level -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Service Level</label>
        <input type="text" [(ngModel)]="posData.serviceLevel" [disabled]="posDataDisabledFields['serviceLevel']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- POS Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">POS Name</label>
        <input type="text" [(ngModel)]="posData.posName" [disabled]="posDataDisabledFields['posName']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>

  <!-- Section des checkboxes -->
  <div class="mt-8">
    <h4 class="text-lg font-semibold text-gray-800 mb-4">Options</h4>
    <div class="flex flex-wrap gap-4">
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.global" [disabled]="posDataDisabledFields['global']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Global</span>
      </label>
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.split" [disabled]="posDataDisabledFields['split']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Split</span>
      </label>
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.longFormat" [disabled]="posDataDisabledFields['longFormat']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">LongFormat</span>
      </label>
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.unattended" [disabled]="posDataDisabledFields['unattended']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Unattended</span>
      </label>
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.waitingCard" [disabled]="posDataDisabledFields['waitingCard']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Waiting Card</span>
      </label>
      <label class="flex items-center">
        <input type="checkbox" [(ngModel)]="posData.choicePayKind" [disabled]="posDataDisabledFields['choicePayKind']" (ngModelChange)="onFieldChange()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Choice Pay Kind</span>
      </label>
    </div>
  </div>
