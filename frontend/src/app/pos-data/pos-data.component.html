  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Colonne de gauche (7 champs) -->
    <div class="space-y-6">
      <!-- POS Timestamp -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">POS Timestamp</label>
        <input type="text" [(ngModel)]="posData.posTimestamp" [disabled]="posDataDisabledFields['posTimestamp']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Language Code -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Language Code</label>
        <select [(ngModel)]="posData.languageCode" [disabled]="posDataDisabledFields['languageCode']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="EN">EN</option>
          <option value="FR">FR</option>
        </select>
      </div>
      <!-- Card Entry Mode -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Card Entry Mode</label>
        <select [(ngModel)]="posData.cardEntryMode" [disabled]="posDataDisabledFields['cardEntryMode']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Physical Card">Physical Card</option>
          <option value="Typed Card Number">Typed Card Number</option>
        </select>
      </div>

      <!-- Options (Moved to left column bottom for better balance) -->
      <div class="pt-2" *ngIf="!posDataDisabledFields['split'] || !posDataDisabledFields['unattended']">
        <label class="block text-sm font-medium text-gray-700 mb-3">POS Options</label>
        <div class="grid grid-cols-2 gap-4">
          <label *ngIf="!posDataDisabledFields['split']" class="relative flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" [class.bg-blue-50]="posData.split" [class.border-blue-300]="posData.split">
            <input type="checkbox" [(ngModel)]="posData.split" [disabled]="posDataDisabledFields['split']" (ngModelChange)="onFieldChange()" class="peer sr-only">
            <div class="w-5 h-5 border-2 border-gray-400 rounded mr-3 peer-checked:bg-blue-600 peer-checked:border-blue-600 flex items-center justify-center transition-all">
              <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <span class="text-sm font-medium" [class.text-blue-700]="posData.split" [class.text-gray-700]="!posData.split">Split Bill</span>
          </label>
          
          <label *ngIf="!posDataDisabledFields['unattended']" class="relative flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" [class.bg-blue-50]="posData.unattended" [class.border-blue-300]="posData.unattended">
            <input type="checkbox" [(ngModel)]="posData.unattended" [disabled]="posDataDisabledFields['unattended']" (ngModelChange)="onFieldChange()" class="peer sr-only">
            <div class="w-5 h-5 border-2 border-gray-400 rounded mr-3 peer-checked:bg-blue-600 peer-checked:border-blue-600 flex items-center justify-center transition-all">
              <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <span class="text-sm font-medium" [class.text-blue-700]="posData.unattended" [class.text-gray-700]="!posData.unattended">Unattended</span>
          </label>
        </div>
      </div>
    </div>
    
    <!-- Colonne de droite -->
    <div class="space-y-6">
      <!-- Clerk ID -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Clerk ID</label>
        <input type="text" [(ngModel)]="posData.clerkId" [disabled]="posDataDisabledFields['clerkId']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- POS Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">POS Name</label>
        <input type="text" [(ngModel)]="posData.posName" [disabled]="posDataDisabledFields['posName']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Shift Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Shift Number</label>
        <input type="text" [(ngModel)]="posData.shiftNumber" [disabled]="posDataDisabledFields['shiftNumber']" (ngModelChange)="onFieldChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>
