<div class="p-4">
  <!-- Conteneur principal avec le cadre gris -->
  <div class="bg-gray-100 rounded-xl shadow-lg p-4">
    <!-- Application de base -->
    <div class="application-base">
      <!-- Grille principale pour Request Information et Response Information -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <!-- Request Information (à gauche) -->
        <div>
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-center text-gray-900">Request Information</h3>
            <div class="flex gap-2">

              <!-- Bouton Configuration avec icône -->
              <button (click)="openConfigurationModal()" class="px-4 py-2 bg-blue-500 text-white rounded-md flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                </svg>
                Configuration
              </button>
            </div>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Colonne gauche -->
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Request Type</label>
                <select [(ngModel)]="requestData.requestType" (ngModelChange)="onRequestTypeChange()" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option *ngFor="let type of requestTypes" [value]="type">{{type}}</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ref Number</label>
                <input type="text" [(ngModel)]="requestData.refNumber" [disabled]="requestInfoDisabledFields['refNumber']" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">App Sender</label>
                <input type="text" [(ngModel)]="requestData.appSender" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <!-- Colonne droite -->
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">POPID</label>
                <input type="text" [(ngModel)]="requestData.popId" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Workstation ID</label>
                <input type="text" [(ngModel)]="requestData.workstationId" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">STAN</label>
                <input type="text" [(ngModel)]="requestData.stan" [disabled]="requestData.requestType !== 'LoyaltyAwardRefund'" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Request ID</label>
                <div class="flex items-center space-x-2">
                  <input type="text" [value]="requestData.requestId" disabled class="flex-1 p-2 border border-gray-300 bg-gray-100 text-gray-500 cursor-not-allowed rounded-md focus:outline-none">
                </div>
              </div>
            </div>
          </div>

<!-- Boutons Send, Clear et Bonus -->
<div class="mt-4 flex justify-center gap-4">
  <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition disabled:opacity-50 disabled:cursor-not-allowed" 
          [disabled]="isLoading"
          (click)="sendRequest()">
    Send
  </button>
  <button class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 transition disabled:opacity-50 disabled:cursor-not-allowed" 
          [disabled]="isLoading"
          (click)="clearFields()">
    Clear
  </button>
  <button class="px-4 py-2 bg-yellow-600 text-white rounded-md hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-yellow-500 transition disabled:opacity-50 disabled:cursor-not-allowed" 
          [disabled]="!isBonusButtonEnabled() || isLoading" 
          (click)="onBonusClick()">
    Bonus
  </button>
</div>

          <!-- Boutons des sous-sections -->
          <div class="flex justify-center gap-4 mt-4">
            <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" (click)="showSubSection('pos-data')">
              POS Data
            </button>
            <button *ngIf="isBasketSectionVisible()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 transition" (click)="showSubSection('basket')">
              Basket
            </button>
            <button *ngIf="isLoyaltySectionVisible()" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" (click)="showSubSection('loyalty')">
              Loyalty
            </button>
          </div>
        </div>

        <!-- Response Information (à droite) -->
        <div class="relative h-full flex flex-col">
          <!-- Loading Spinner specifically for Response Information -->
          <div *ngIf="isLoading" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-gray-50 bg-opacity-95 rounded-xl border-2 border-dashed border-blue-400">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-500 mb-3"></div>
            <p class="text-md font-semibold text-gray-600">Waiting for EPS Response...</p>
          </div>
          <!-- The actual Response Information Component -->
          <app-response-info class="flex-1" *ngIf="!isLoading" [responseData]="responseInfo" [expectedRequestId]="responseRequestId"></app-response-info>
        </div>
      </div>

      <!-- Sous-sections -->
      <div class="mb-4">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Séparateur (div vide pour l'espace) -->
    <div class="h-4"></div>

    <!-- Nouvelles sections (Devices et Data Request) -->
    <div class="new-sections">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Devices -->
      
<div>
  <h3 class="text-lg font-bold text-gray-900 mb-4">Devices</h3>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Display</label>
      <div class="w-full p-3 border-2 border-gray-400 rounded-md bg-gray-50 text-gray-800 font-mono uppercase tracking-wide text-center whitespace-pre-wrap break-words min-h-[4rem] flex flex-col justify-center shadow-inner">
        {{ deviceData.display || ' ' }}
      </div>
    </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Printer Receipt</label>
          <div class="p-4 bg-white text-gray-900 font-mono text-sm whitespace-pre shadow-md border border-gray-300 mx-auto rounded" style="font-family: 'Courier New', Courier, monospace; letter-spacing: 0px; width: max-content; min-width: 350px; min-height: 15rem;">{{ deviceData.printer || ' ' }}</div>
        </div>
  </div>
</div>

      </div>
    </div>

    <!-- Modal pour Ǹchec de paiement -->
    <div *ngIf="showFailureModal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-900 bg-opacity-75">
      <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full text-center border-4 border-red-500">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
          <svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-900 mb-2">Payment Declined</h3>
        <p class="text-gray-600 mb-8">The terminal has rejected the payment or it failed to process. What would you like to do?</p>
        <div class="flex flex-col gap-3">
          <button class="w-full px-4 py-3 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition" (click)="retryPayment()">
            Retry Payment (Change Card or Method)
          </button>
          <button class="w-full px-4 py-3 bg-gray-200 text-gray-800 rounded-md font-semibold hover:bg-gray-300 transition" (click)="cancelTransaction()">
            Cancel Transaction
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
