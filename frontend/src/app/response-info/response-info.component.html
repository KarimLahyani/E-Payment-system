<div class="bg-indigo-50 border border-indigo-200 rounded-xl p-6 shadow-sm h-full">
  <h3 class="text-xl font-bold text-center text-indigo-900 mb-6">Response Information</h3>

  <div *ngIf="matchingResponse as response; else noData" class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="space-y-6">
      <!-- Request Type -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Request Type</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.attributes.requestType || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>

      <!-- Terminal ID -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Terminal ID</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.terminal.terminalId || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>

      <!-- Amount -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Amount</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.tender.totalAmount.value || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>

      <!-- Request ID -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Request ID</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.attributes.requestId || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>
    </div>

    <div class="space-y-6">
      <!-- Overall Result -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Overall Result</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.attributes.overallResult || ''"
          readonly
          class="w-full p-2 border rounded-md font-bold transition-colors duration-300"
          [ngClass]="{
            'text-green-700 bg-green-50 border-green-400': response.cardServiceResponse.attributes.overallResult === 'Success',
            'text-red-700 bg-red-50 border-red-400': response.cardServiceResponse.attributes.overallResult === 'Failure',
            'bg-white text-indigo-900 border-indigo-300': response.cardServiceResponse.attributes.overallResult !== 'Success' && response.cardServiceResponse.attributes.overallResult !== 'Failure'
          }"
        />
      </div>

      <!-- Error Condition (Only if present) -->
      <div *ngIf="response.cardServiceResponse.attributes.errorCondition">
        <label class="block text-sm font-medium text-red-800 mb-2">Error Reason</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.attributes.errorCondition"
          readonly
          class="w-full p-2 border border-red-300 rounded-md bg-red-100 text-red-800 font-semibold"
        />
      </div>

      <!-- STAN -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">STAN</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.terminal.stan || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>

      <!-- Terminal Batch -->
      <div>
        <label class="block text-sm font-medium text-indigo-800 mb-2">Terminal Batch</label>
        <input
          type="text"
          [value]="response.cardServiceResponse.terminal.terminalBatch || ''"
          readonly
          class="w-full p-2 border border-indigo-300 rounded-md bg-white text-indigo-900"
        />
      </div>
    </div>
  </div>

  <!-- Message si aucune donnée n'est disponible -->
  <ng-template #noData>
    <div class="text-center text-indigo-600 mt-6 bg-white p-4 rounded-lg border border-indigo-200">
      No response information available.
    </div>
  </ng-template>
</div>
