<h3 class="text-lg font-bold text-center text-gray-900 mb-4">Sale Item Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <!-- Colonne de gauche -->
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Product Name</label>
      <input type="text" [(ngModel)]="saleItem.productName" readonly class="w-full p-3 border border-gray-300 rounded-md bg-gray-100 cursor-not-allowed focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Product Code</label>
      <input type="text" [(ngModel)]="saleItem.productCode" readonly class="w-full p-3 border border-gray-300 rounded-md bg-gray-100 cursor-not-allowed focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Unit Price</label>
      <input type="text" [(ngModel)]="saleItem.unitPrice" (ngModelChange)="onFieldChange('unitPrice', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Tax Code</label>
      <input type="text" [(ngModel)]="saleItem.taxCode" (ngModelChange)="onFieldChange('taxCode', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>

  <!-- Colonne de droite -->
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
      <div class="flex items-center">
        <button (click)="decreaseQuantity()" class="px-4 py-2 bg-gray-200 border border-gray-300 rounded-l-md hover:bg-gray-300 focus:outline-none font-bold text-gray-700">-</button>
        <input type="text" [(ngModel)]="saleItem.quantity" (ngModelChange)="onFieldChange('quantity', $event)" class="w-full p-3 border-y border-gray-300 text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button (click)="increaseQuantity()" class="px-4 py-2 bg-gray-200 border border-gray-300 rounded-r-md hover:bg-gray-300 focus:outline-none font-bold text-gray-700">+</button>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Item Amount</label>
      <input type="text" [value]="saleItem.itemAmount" readonly class="w-full p-3 border border-gray-300 rounded-md bg-gray-100 text-gray-700">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Unit Measure</label>
      <input type="text" [(ngModel)]="saleItem.unitMeasure" (ngModelChange)="onFieldChange('unitMeasure', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Rebate Label</label>
      <input type="text" [(ngModel)]="saleItem.rebateLabel" (ngModelChange)="onFieldChange('rebateLabel', $event)" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>
</div>
