
  <h3 class="text-2xl font-bold text-center text-gray-900 mb-8">Basket</h3>

  <!-- Première section : Total Amount, PreAuth Amount, Currency -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Total Amount</label>
      <input type="text" [(ngModel)]="basketData.totalAmount" (ngModelChange)="onManualBasketChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">PreAuth Amount</label>
      <input type="text" [(ngModel)]="basketData.preAuthAmount" (ngModelChange)="onManualBasketChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Currency</label>
      <select [(ngModel)]="basketData.currency" (ngModelChange)="onManualBasketChange()" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="EUR">EUR (€)</option>
        <option value="USD">USD ($)</option>
        <option value="GBP">GBP (£)</option>
      </select>
    </div>
  </div>

  <!-- Section Sale Items avec boutons pour navigation et sélection -->
  <div class="mb-6">
    <h4 class="text-lg font-semibold text-gray-800 mb-4">Sale Items</h4>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button 
        *ngIf="currentIndex > 0" 
        class="px-2 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        (click)="prevItems()">
        ← <!-- Flèche à gauche -->
      </button>
      <button 
        *ngFor="let item of displayedItems" 
        [ngClass]="{
          'bg-green-600': item.isSelected && item.productName !== selectedSaleItem?.productName,
          'bg-green-700 ring-2 ring-blue-500': item.isSelected && item.productName === selectedSaleItem?.productName,
          'bg-gray-400 text-gray-800': !item.isSelected && item.productName !== selectedSaleItem?.productName,
          'bg-gray-500 text-white ring-2 ring-blue-500': !item.isSelected && item.productName === selectedSaleItem?.productName
        }"
        class="px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        (click)="selectItem(item)">
        {{ item.productName }}
      </button>
      <button 
        *ngIf="currentIndex + itemsPerPage < saleItemsList.length" 
        class="px-2 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        (click)="nextItems()">
        → <!-- Flèche à droite -->
      </button>
    </div>
  </div>

  <!-- Afficher uniquement les détails du Sale Item sélectionné -->
  <div class="mb-6" *ngIf="selectedSaleItem">
    <h4 class="text-lg font-semibold text-gray-800 mb-4">Sale Item Details</h4>
    <app-sale-item [saleItem]="selectedSaleItem" (saleItemChange)="onSaleItemChange($event)"></app-sale-item>
  </div>

  <div *ngIf="!selectedSaleItem" class="text-center text-gray-600 mt-6">
    No Sale Item selected. Use the navigation buttons to select an item.
  </div>
